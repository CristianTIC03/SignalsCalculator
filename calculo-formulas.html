<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Fórmulas</title>
    <link rel="stylesheet" href="stylescalculo-formulas.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="video-background">
        <video id="backgroundVideo" autoplay muted playsinline>
            <source id="videoSource" src="ondascolores.mp4" type="video/mp4">
            Tu navegador no soporta el elemento de video.
        </video>
    </div>
    
    
    <div class="slider-container">
        <div class="slider-background">
            <div class="slider"></div>
            <div class="slider-buttons">
                <div class="slider-button" data-index="1">Calculadora Básica</div>
                <div class="slider-button" data-index="0">Inicio</div>
                <div class="slider-button" data-index="2">Calculadora de Fórmulas</div>
            </div>
        </div>
    </div>
    
    <div class="content">
        <h1>Calculadora de Fórmulas</h1>
        <p>Aquí puedes realizar cálculos avanzados con diferentes fórmulas.</p>
        <h3>Selecciona una fórmula</h3>
        <div class="row2">
            <div class="buttons-left">
                <button id="wavelengthButton" onclick="showFormula('wavelength'), scrollToTarget()">Longitud de Onda</button>
                <button id="frequencyButton" onclick="showFormula('frequency'), scrollToTarget()">Frecuencia</button>
                <button id="velocityButton" onclick="showFormula('velocity'), scrollToTarget()">Velocidad</button>
                <button id="shannonButton" onclick="showFormula('shannon'), scrollToTarget()">Capacidad de Información</button>
                <button id="snrButton" onclick="showFormula('snr'), scrollToTarget()">Relación S/N (Potencia)</button>
            </div>
            <div class="buttons-left">
                <button id="snrVoltageButton" onclick="showFormula('snrVoltage'), scrollToTarget()">Relación S/N (Voltaje)</button>
                <button id="thermalNoiseButton" onclick="showFormula('thermalNoise'), scrollToTarget()">Ruido Térmico</button>
                <button id="noiseVoltageButton" onclick="showFormula('noiseVoltage'), scrollToTarget()">Voltaje de Ruido</button>
                <button id="noiseFactorButton" onclick="showFormula('noiseFactor'), scrollToTarget()">Factor de Ruido</button>
                <button id="noiseIndexButton" onclick="showFormula('noiseIndex'), scrollToTarget()">Índice de Ruido</button>
            </div>
            <div class="buttons-left">
                <button id="linkBudgetButton" onclick="showFormula('linkBudget'), scrollToTarget()">Presupuesto de Enlace</button>
                <button id="berButton" onclick="showFormula('ber'), scrollToTarget()">BER</button>
                <button id="bandwidthButton" onclick="showFormula('bandwidth'), scrollToTarget()">Ancho de Banda</button>
                <button id="wattToDbButton" onclick="showFormula('wattToDb'), scrollToTarget()">Watt a dB</button>
                <button id="dbToWattButton" onclick="showFormula('dbToWatt'), scrollToTarget()">dB a Watt</button>
            </div>
            
        </div>
        <section id="scrollTarget" style="height: 50px;"></section> 
        <div class="formula-box" id="formulaBox">
            <div class="formula"></div>
        </div>
        
        <div id="inputsContainer" class="inputs-container"></div>
        
        <div class="inputs-box" id="inputsBox">
            <button class="calc-button" onclick="calculateCustomResult()">Calcular</button>
        </div>
        <div class="graph-container">
            <canvas id="waveCanvas"></canvas>
        </div>
        <div class="display" id="display">0</div>
        
        
    </div>

    <script src="scriptformulas.js"></script>
</body>
</html>
